services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SWEEP_SECRET: ${SWEEP_SECRET}
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://${POSTGRES_USER:?set it in .env (npm run setup copies .env.example)}:${POSTGRES_PASSWORD:?set it in .env (npm run setup copies .env.example)}@db:5432/${POSTGRES_DB:?set it in .env (npm run setup copies .env.example)}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      # No defaults: credentials come from .env only, never from this file (threat model T-11).
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env (npm run setup copies .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (npm run setup copies .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env (npm run setup copies .env.example)}
    ports:
      # Local development only: never reachable from the network (threat model T-11).
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
