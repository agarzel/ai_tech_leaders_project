<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevMentor mentor onboarding prototype</title>
<style>
:root { --bg:#f4f4f4; --panel:#fff; --line:#8a8a8a; --text:#1a1a1a; --muted:#555; --soft:#e6e6e6; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); line-height:1.45; }
a { color:#111; }
:focus-visible { outline:3px solid #000; outline-offset:2px; }
.banner { background:#222; color:#fff; padding:6px 16px; font-size:14px; }
header.top { background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
header.top nav { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
.wrap { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:16px; }
main { background:var(--panel); border:1px solid var(--line); padding:16px; min-width:0; }
main h1 { margin-top:0; font-size:24px; }
h2 { font-size:18px; margin:20px 0 8px; }
.card { border:1px solid var(--line); padding:12px; margin:12px 0; background:#fafafa; }
.field { margin:12px 0; }
label, .lbl { display:block; font-weight:600; margin-bottom:4px; }
input[type=text], input[type=password], input[type=email], textarea, select { width:100%; max-width:480px; padding:8px; border:1px solid var(--line); background:#fff; font:inherit; }
input[type=checkbox] { margin-right:6px; }
.hint { color:var(--muted); font-size:14px; }
.err { color:#000; font-weight:600; border-left:4px solid #000; padding-left:8px; margin-top:4px; }
.alert { border:2px solid #000; padding:10px; margin:12px 0; background:#fff; }
.alert.info { border-style:dashed; }
button, .btn { font:inherit; padding:8px 14px; border:1px solid #000; background:var(--soft); cursor:pointer; text-decoration:none; color:#000; display:inline-block; }
button.primary { background:#222; color:#fff; }
button[disabled], button[aria-disabled=true] { border-style:dashed; color:#666; cursor:not-allowed; background:#eee; }
table { border-collapse:collapse; width:100%; }
th, td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
.badge { border:1px solid #000; padding:1px 6px; font-size:13px; }
.checklist { list-style:none; padding:0; }
.checklist li { padding:6px 0; border-bottom:1px solid var(--soft); }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.scroll { overflow-x:auto; }
aside.test { background:#eee; border:1px dashed #000; padding:12px; }
aside.test summary { font-weight:700; cursor:pointer; }
aside.test .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-top:10px; }
aside.test select { max-width:none; }
.mono { font-family:ui-monospace,Menlo,monospace; word-break:break-all; }
@media (max-width:480px) { main { padding:12px; } th, td { padding:4px; } }
</style>
</head>
<body>
<div class="banner">Discovery prototype. Simulated data.</div>
<header class="top"><strong>DevMentor</strong><nav id="nav" aria-label="Main"></nav></header>
<div class="wrap">
  <div id="status" role="status" aria-live="polite" class="hint"></div>
  <main id="app" aria-label="Screen"></main>
  <aside class="test" id="test" aria-label="Test state"></aside>
</div>
<script>
"use strict";
(function () {
  var T0 = Date.UTC(2026, 9, 23, 10, 0);
  var HOUR = 3600000;
  var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var TAGS = ["Python","TypeScript","AI agents"];
  var S, working = false;

  function slot(id, y, m, d, hh, mm, booked) { return { id: id, t: Date.UTC(y, m - 1, d, hh, mm), booked: !!booked }; }
  function fresh() {
    return {
      session: null, next: null, offsetH: 0, expired: false, net: "ok", invList: "full",
      dupAccount: false, usedMeanwhile: false, values: {}, errs: {}, banner: null, flash: null,
      shownLink: null, tokenSeq: 1, slotSeq: 100, confirmDelete: null,
      accounts: {
        "marek.zielinski@example.com": { name: "Marek Zielinski", pw: "helm-chart-rollback-2", role: "mentor" },
        "oliwia.nowak@example.com": { name: "Oliwia Nowak", pw: "demo-admin-passphrase-1", role: "admin" },
        "ola.wisniewska@example.com": { name: "Ola Wisniewska", pw: "ingress-1-28-upgrade", role: "mentee" }
      },
      mentors: {
        "marek.zielinski@example.com": {
          slug: "marek-zielinski-k3x9q2", name: "Marek Zielinski",
          headline: "Platform engineer - Kubernetes, Helm, CI pipelines", bio: "Ten years of running clusters.",
          tags: ["Python", "AI agents"], links: "https://github.com/marek-zielinski\nhttps://kubecon.example/talks/helm-rollbacks-without-tears",
          p25: "180", p50: "320", listed: true, saved: true,
          slots: [slot(1,2026,10,23,16,0), slot(2,2026,10,24,9,30), slot(3,2026,10,24,12,0), slot(4,2026,10,26,18,0),
                  slot(5,2026,10,26,19,30), slot(6,2026,10,28,18,0,true), slot(7,2026,10,30,17,0), slot(8,2026,11,2,18,0)]
        }
      },
      invitations: [
        { email: "anna.maj@example.com", token: "anna-maj-4f2k", status: "pending", note: "valid until 2026-11-06" },
        { email: "marek.zielinski@example.com", token: "marek-used-7q", status: "used", note: "used 2026-10-10" },
        { email: "jan.sowa@example.com", token: "jan-expired-2z", status: "expired", note: "expired 2026-10-04" }
      ]
    };
  }
  S = fresh();

  /* ---------- helpers ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === false || v == null) return;
      if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (k === "value" || k === "checked" || k === "disabled") el[k] = v;
      else el.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
    else el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  function now() { return T0 + S.offsetH * HOUR; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtDay(t) { var d = new Date(t); return DAYS[d.getUTCDay()] + " " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
  function fmtTime(t) { var d = new Date(t); return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()); }
  function say(msg) { document.getElementById("status").textContent = ""; setTimeout(function () { document.getElementById("status").textContent = msg; }, 20); }
  function go(hash) { if (location.hash === hash) render(true); else location.hash = hash; }
  function me() { return S.session ? S.accounts[S.session] : null; }
  function mentorOf(email) { return S.mentors[email]; }
  function bookable(s) { return !s.booked && s.t - now() >= 24 * HOUR; }
  function pricesSet(m) { return !!(m.p25 && m.p50); }
  function offer(m) {
    var n = m.slots.filter(bookable).length;
    return { saved: m.saved, prices: pricesSet(m), bookableCount: n, ready: m.saved && pricesSet(m) && n > 0, onList: m.listed && m.saved && pricesSet(m) && n > 0 };
  }
  function shareUrl(m) { return "https://devmentor.example/m/" + m.slug; }
  function vals(form, defaults) { return S.values[form] || defaults || {}; }
  function fieldErr(form, name) { return (S.errs[form] || {})[name]; }
  function field(form, name, label, opts) {
    opts = opts || {};
    var v = vals(form)[name]; if (v == null) v = (opts.def == null ? "" : opts.def);
    var err = fieldErr(form, name), id = form + "-" + name, eid = id + "-err";
    var input = opts.textarea
      ? h("textarea", { id: id, name: name, rows: 3, "aria-invalid": err ? "true" : false, "aria-describedby": err ? eid : false }, v)
      : h("input", { id: id, name: name, type: opts.type || "text", value: v, autocomplete: opts.ac || "off", "aria-invalid": err ? "true" : false, "aria-describedby": err ? eid : false });
    return h("div", { class: "field" }, h("label", { for: id, text: label }), opts.hint ? h("div", { class: "hint", text: opts.hint }) : null, input, err ? h("div", { class: "err", id: eid, text: err }) : null);
  }
  function readForm(f) {
    var o = {};
    Array.prototype.forEach.call(f.elements, function (e) {
      if (!e.name) return;
      if (e.type === "checkbox") { if (e.name === "tags") { (o.tags = o.tags || []); if (e.checked) o.tags.push(e.value); } else o[e.name] = e.checked; }
      else o[e.name] = e.value;
    });
    return o;
  }
  function serverGate(form, done) {
    if (working) return;
    working = true; rerenderBusy(true);
    setTimeout(function () {
      working = false; rerenderBusy(false);
      if (S.net === "net") { S.flash = { form: form, kind: "alert", text: "Could not reach the server. Your entries are kept. Try again." }; render(true, form); return; }
      if (S.net === "429") { S.flash = { form: form, kind: "alert", text: "Too many attempts. Try again in 15 minutes." }; render(true, form); return; }
      S.flash = null; done();
    }, 250);
  }
  function rerenderBusy(b) {
    Array.prototype.forEach.call(document.querySelectorAll("#app button[type=submit]"), function (x) {
      x.disabled = b; if (b) x.setAttribute("data-label", x.textContent);
      x.textContent = b ? x.getAttribute("data-busy") || "Working..." : x.getAttribute("data-label") || x.textContent;
    });
  }
  function sessionGuard(form, values) {
    if (S.expired) {
      S.values[form] = values; S.next = location.hash; S.session = null; S.expired = false;
      S.banner = "Your session has ended";
      go("#/login"); return false;
    }
    return true;
  }
  function flashFor(form) { return S.flash && S.flash.form === form ? h("div", { class: "alert", role: "alert", tabindex: "-1", id: "flash-alert", text: S.flash.text }) : null; }
  function summary(form) {
    var e = S.errs[form]; if (!e || !Object.keys(e).filter(function (k) { return k !== "_form"; }).length) return null;
    return h("div", { class: "alert", role: "alert", text: "Fix the highlighted fields and try again." });
  }
  function focusFirstError(form) {
    var e = S.errs[form]; if (!e) return;
    var first = document.querySelector("#app [aria-invalid=true]") || document.getElementById("flash-alert") || document.querySelector("#app .alert[role=alert]"); if (first) first.focus();
  }

  /* ---------- chrome ---------- */
  function renderNav() {
    var nav = document.getElementById("nav"); nav.textContent = "";
    var u = me();
    add(nav, h("a", { href: "#/", text: "Start" }));
    if (!u) add(nav, h("a", { href: "#/login", text: "Log in" }));
    else {
      if (u.role === "mentor") add(nav, [h("a", { href: "#/mentor", text: "Dashboard" }), h("a", { href: "#/mentor/profile", text: "Profile" }), h("a", { href: "#/mentor/slots", text: "Slots" })]);
      if (u.role === "admin") add(nav, [h("a", { href: "#/admin", text: "Admin" }), h("a", { href: "#/admin/invitations", text: "Invitations" })]);
      add(nav, h("span", { text: u.name + " (" + u.role + ")" }));
      add(nav, h("button", { type: "button", text: "Log out", onclick: function () { S.session = null; S.next = null; S.banner = null; go("#/"); say("You have been logged out."); } }));
    }
  }
  function sel(label, key, opts, onchange) {
    var s = h("select", { id: "t-" + key, onchange: function (e) { onchange(e.target.value); } },
      opts.map(function (o) { return h("option", { value: o[0], text: o[1], selected: String(S[key]) === o[0] }); }));
    return h("div", null, h("label", { for: "t-" + key, text: label }), s);
  }
  function renderTest() {
    var t = document.getElementById("test");
    var open = t.querySelector("details") ? t.querySelector("details").open : true;
    t.textContent = "";
    var tokens = [["Valid invitation (anna.maj@example.com)", "anna-maj-4f2k"], ["Used invitation", "marek-used-7q"], ["Expired invitation", "jan-expired-2z"], ["Unknown token", "zzz-unknown"]];
    var d = h("details", { open: open },
      h("summary", { text: "Test state (prototype controls, not product features)" }),
      h("div", { class: "grid" },
        sel("Server response", "net", [["ok", "Normal"], ["net", "Network error"], ["429", "Too many attempts"]], function (v) { S.net = v; S.flash = null; }),
        sel("Invitation list", "invList", [["full", "Full"], ["empty", "Empty"], ["error", "Load error"]], function (v) { S.invList = v; render(true); }),
        sel("Demo clock (now = Fri 23 Oct 2026 10:00 Europe/Warsaw)", "offsetH", [["0", "+0 h"], ["6", "+6 h"], ["24", "+24 h"]], function (v) { S.offsetH = Number(v); render(true); }),
        h("div", null, h("label", null, h("input", { type: "checkbox", checked: S.usedMeanwhile, onchange: function (e) { S.usedMeanwhile = e.target.checked; } }), "Invitation used in the meantime")),
        h("div", null, h("label", null, h("input", { type: "checkbox", checked: S.dupAccount, onchange: function (e) { S.dupAccount = e.target.checked; } }), "Invited e-mail already has an account (mentor sign-up)")),
        h("div", null, h("button", { type: "button", id: "t-expire", disabled: !S.session, text: "Expire session now", onclick: function () { S.expired = true; say("Session marked as expired. The next save will end it."); } }))
      ),
      h("div", { class: "row", style: "margin-top:10px" }, [
        h("button", { type: "button", id: "t-as-admin", text: "Shortcut: log in as demo admin", onclick: function () { S.session = "oliwia.nowak@example.com"; S.banner = null; go("#/admin"); } }),
        h("button", { type: "button", id: "t-as-mentor", text: "Shortcut: log in as demo mentor (Marek, ready offer)", onclick: function () { S.session = "marek.zielinski@example.com"; S.banner = null; go("#/mentor"); } }),
        h("button", { type: "button", id: "t-as-mentee", text: "Shortcut: log in as demo mentee", onclick: function () { S.session = "ola.wisniewska@example.com"; S.banner = null; go("#/mentors"); } })
      ]),
      h("p", { class: "hint", text: "Open an invitation link:" }),
      h("div", { class: "row" }, tokens.map(function (x) { return h("a", { href: "#/register/" + x[1], text: x[0] }); }).concat([h("a", { href: "#/register", text: "No token" })])),
      h("div", { style: "margin-top:10px" }, h("button", { type: "button", id: "t-reset", text: "Reset simulation", onclick: function () { S = fresh(); working = false; go("#/"); renderTest(); renderNav(); say("Simulation reset to the start."); } }))
    );
    t.appendChild(d);
  }

  /* ---------- screens ---------- */
  var screens = {};
  function heading(text) { return h("h1", { tabindex: "-1", id: "page-h1", text: text }); }
  function protectedGuard(role) {
    var u = me();
    if (!u) { S.next = location.hash; S.banner = "Log in to continue."; go("#/login"); return false; }
    if (u.role !== role) { S.next = location.hash; S.banner = "This page is for " + role + " accounts. Log in with a different account."; go("#/login"); return false; }
    return true;
  }

  screens.start = function () {
    return h("div", null, heading("Mentor onboarding (prototype start)"),
      h("p", { text: "Flow: the founder invites a mentor, the mentor registers, sets a profile and prices, adds slots, and gets a share link." }),
      h("ol", null,
        h("li", null, h("a", { href: "#/login", text: "Log in" }), " (any role)"),
        h("li", null, "As admin: ", h("a", { href: "#/admin/invitations", text: "Invitations" })),
        h("li", null, "As the invited mentor: open the valid invitation link from the Test state area"),
        h("li", null, "Public page of a mentor: ", h("a", { href: "#/m/marek-zielinski-k3x9q2", text: "marek-zielinski-k3x9q2" }))),
      h("p", { class: "hint", text: "Outside this prototype: the mentor list, bookings, payments, acceptance, sessions, cancellation and notes." }));
  };

  screens.outside = function () {
    return h("div", null, heading("Outside this prototype"),
      h("p", { text: "This destination belongs to a later part of the product and is not simulated here." }),
      h("p", null, h("a", { href: "#/", text: "Back to the start" })));
  };
  screens.notfound = function () {
    return h("div", null, heading("Page not found"), h("p", { text: "This address does not exist." }), h("a", { href: "#/", text: "Back to the start" }));
  };

  screens.login = function () {
    var f = "login", u = me();
    var form = h("form", { novalidate: true, id: "login-form", onsubmit: function (e) {
      e.preventDefault(); var v = readForm(e.target); S.values[f] = v; S.errs[f] = {}; S.flash = null;
      serverGate(f, function () {
        var acc = S.accounts[(v.email || "").trim().toLowerCase()];
        if (!acc || acc.pw !== v.password) { S.errs[f] = { _form: "Invalid email or password" }; S.values[f] = { email: v.email, password: "" }; render(true, f); return; }
        S.session = (v.email || "").trim().toLowerCase(); S.values[f] = null; S.errs[f] = {}; S.banner = null; S.expired = false;
        var role = acc.role, dest = S.next; S.next = null;
        if (!dest) dest = role === "mentor" ? "#/mentor" : role === "admin" ? "#/admin" : "#/mentors";
        go(dest); say("Logged in as " + acc.name + ".");
      });
    } },
      S.errs[f] && S.errs[f]._form ? h("div", { class: "alert", role: "alert", tabindex: "-1", text: S.errs[f]._form }) : null,
      flashFor(f),
      field(f, "email", "Email", { type: "email", ac: "username" }),
      field(f, "password", "Password", { type: "password", ac: "current-password" }),
      h("button", { type: "submit", class: "primary", "data-busy": "Logging in...", text: "Log in" }));
    return h("div", null, heading("Log in"),
      S.banner ? h("div", { class: "alert info", role: "status", text: S.banner }) : null,
      u ? h("p", { class: "hint", text: "You are currently logged in as " + u.name + ". Logging in replaces this session." }) : null,
      form,
      h("p", { class: "hint", text: "Forgot your password? Ask the founders to reset it." }));
  };

  screens.register = function (token) {
    var f = "register";
    var inv = S.invitations.filter(function (i) { return i.token === token; })[0];
    if (!inv || inv.status !== "pending") {
      return h("div", null, heading("This invitation is no longer valid"),
        h("p", { text: "Ask the founders for a new link." }), h("a", { href: "#/login", text: "Go to log in" }));
    }
    var form = h("form", { novalidate: true, id: "register-form", onsubmit: function (e) {
      e.preventDefault(); var v = readForm(e.target); S.values[f] = v; var errs = {};
      if (!v.name.trim()) errs.name = "Enter your name.";
      if (v.password.length < 12 || v.password.length > 128) errs.password = "Use 12 to 128 characters.";
      S.errs[f] = errs; S.flash = null;
      if (Object.keys(errs).length) { render(true, f); return; }
      serverGate(f, function () {
        if (S.usedMeanwhile) { inv.status = "used"; inv.note = "used just now"; S.usedMeanwhile = false; S.values[f] = null; render(true); return; }
        if (S.dupAccount || S.accounts[inv.email]) { S.errs[f] = { _form: "This address already has an account. Log in, or ask the founders to promote the account." }; render(true, f); return; }
        S.accounts[inv.email] = { name: v.name.trim(), pw: v.password, role: "mentor" };
        S.mentors[inv.email] = { slug: v.name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-n3w1x7", name: v.name.trim(), headline: "", bio: "", tags: [], links: "", p25: "", p50: "", listed: false, saved: false, slots: [] };
        inv.status = "used"; inv.note = "used just now"; S.session = inv.email; S.values[f] = null; S.errs[f] = {}; S.expired = false;
        go("#/mentor"); say("Mentor account created.");
      });
    } },
      S.errs[f] && S.errs[f]._form ? h("div", { class: "alert", role: "alert", tabindex: "-1", text: S.errs[f]._form }) : null,
      summary(f), flashFor(f),
      h("div", { class: "field" }, h("span", { class: "lbl", text: "Registering email" }), h("span", { id: "reg-email", text: inv.email }), h("div", { class: "hint", text: "This address comes from the invitation and cannot be changed." })),
      field(f, "name", "Name", { ac: "name" }),
      field(f, "password", "Password", { type: "password", ac: "new-password", hint: "12 to 128 characters." }),
      h("button", { type: "submit", class: "primary", "data-busy": "Creating account...", text: "Create mentor account" }));
    return h("div", null, heading("Create your mentor account"), form);
  };

  screens.admin = function () {
    if (!protectedGuard("admin")) return null;
    return h("div", null, heading("Admin"), h("ul", null, h("li", null, h("a", { href: "#/admin/invitations", text: "Invitations" })), h("li", { class: "hint", text: "Users (outside this prototype)" })));
  };

  screens.invitations = function () {
    if (!protectedGuard("admin")) return null;
    var f = "invite";
    var form = h("form", { novalidate: true, id: "invite-form", onsubmit: function (e) {
      e.preventDefault(); var v = readForm(e.target); S.values[f] = v; var errs = {}; var email = v.email.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) errs.email = "Enter a valid email address.";
      else if (S.accounts[email]) errs.email = "This address already has an account – log in";
      S.errs[f] = errs; S.flash = null;
      if (Object.keys(errs).length) { render(true, f); return; }
      if (!sessionGuard(f, v)) return;
      serverGate(f, function () {
        S.invitations.forEach(function (i) { if (i.email === email && i.status === "pending") { i.status = "revoked"; i.note = "replaced by a newer invitation"; } });
        var tok = "tok-" + (S.tokenSeq++) + "-x9";
        S.invitations.unshift({ email: email, token: tok, status: "pending", note: "valid until 2026-11-06" });
        S.shownLink = tok; S.values[f] = null; S.errs[f] = {};
        render(true); say("Invitation created. The link is shown once.");
        var lp = document.getElementById("link-panel"); if (lp) lp.focus();
      });
