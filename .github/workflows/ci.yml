name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/packages/app/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Fails if coverage of core, db and ui drops below 100%.
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chrome for Testing + Linux libraries for the headless browser.
      - run: npx agent-browser install --with-deps

      # Ephemeral PostgreSQL via testcontainers (Docker is available on the runner),
      # migrations + seed, the app in dev mode, browser tests with agent-browser.
      - run: npm run test:integration

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-screenshots
          path: packages/app/tests/integration/.artifacts/
          include-hidden-files: true
          retention-days: 14

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devmentor
          POSTGRES_PASSWORD: devmentor
          POSTGRES_DB: devmentor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devmentor -d devmentor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://devmentor:devmentor@localhost:5432/devmentor
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Apply all migrations to an empty database...
      - run: npm run db:migrate
      # ...and fail if entities changed without a matching migration.
      - run: npm run db:migration:check

  design-tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # No values outside tokens, no gradients, blur, shadows, round shapes, emoji or Sparkles (0 hits).
      - run: npm run lint:tokens
      # The component tables in .ai/docs/design-system.md match components-data.ts.
      - run: npm run docs:design-system:check

  storybook:
    name: Storybook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium + Linux libraries for the browser that runs the stories.
      - run: npx playwright install --with-deps chromium

      # The documentation builds (MDX, tables, links)...
      - run: npm run build-storybook
      # ...and every story passes as a browser test in both themes; accessibility violations fail.
      - run: npm run test:storybook

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: devmentor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
